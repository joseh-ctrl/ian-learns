<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ian Learns">
<meta name="theme-color" content="#0b1633">
<title>Ian Learns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2c3a5e; --ink-soft:#61709a;
  --pink:#ff8a3d; --purple:#3f7cf0; --blue:#7fd1ff; --gold:#ffd34d; --green:#8be0a0;
  --sky1:#e7f0ff; --sky2:#dcefff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:'Fredoka',ui-rounded,system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#0b1633 0%,#163063 55%,#1f4a8a 100%);
  min-height:100dvh;overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
body::before{ /* spotlights and twinkly stars */
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(2px 2px at 8% 22%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 30% 8%,#fff 50%,transparent 51%),
    radial-gradient(2px 2px at 62% 14%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 88% 26%,#fff 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 46% 32%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 76% 6%,#fff 50%,transparent 51%),
    conic-gradient(from 150deg at 12% -6%,rgba(255,170,80,0) 0deg,rgba(255,170,80,.22) 7deg,rgba(255,170,80,0) 14deg,transparent 14deg),
    conic-gradient(from 196deg at 88% -6%,rgba(110,220,255,0) 0deg,rgba(110,220,255,.24) 7deg,rgba(110,220,255,0) 14deg,transparent 14deg),
    conic-gradient(from 173deg at 50% -10%,rgba(255,230,140,0) 0deg,rgba(255,230,140,.16) 7deg,rgba(255,230,140,0) 14deg,transparent 14deg);
}
body::after{ /* race track along the bottom: checkered stripe, road, dashed lane line */
  content:'';position:fixed;left:0;right:0;bottom:0;height:8vh;z-index:-1;pointer-events:none;
  background:
    repeating-linear-gradient(90deg,#fff 0 12px,#1a1d24 12px 24px) 0 0/100% 6px no-repeat,
    repeating-linear-gradient(90deg,#fff 0 12px,#1a1d24 12px 24px) 12px 6px/100% 6px no-repeat,
    repeating-linear-gradient(90deg,rgba(255,255,255,.75) 0 34px,transparent 34px 70px) 0 55%/100% 4px no-repeat,
    linear-gradient(180deg,#3a3f4b,#23262e);
}
#app{display:flex;flex-direction:column;height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;min-height:64px}
.topbar[hidden]{display:none}
.icon-btn{font:inherit;font-size:1.6rem;width:52px;height:52px;border-radius:50%;border:0;background:#fff;
  box-shadow:0 4px 0 #cdd9ef;cursor:pointer;flex:none}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #cdd9ef}
.icon-btn[hidden]{visibility:hidden;display:block}
.gems{background:#fff;border-radius:999px;padding:8px 18px;font-weight:700;font-size:1.4rem;box-shadow:0 4px 0 #cdd9ef}
.gems.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}
main{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:4px 16px 16px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;width:100%}
h1.title{margin:0;font-size:clamp(2rem,9vw,3.4rem);line-height:1.05;
  background:linear-gradient(90deg,#ffb03b,#ffe066,#7fe3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.big-btn{font:inherit;font-size:clamp(1.3rem,5.5vw,1.8rem);font-weight:700;border:0;border-radius:999px;padding:16px 34px;
  background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;box-shadow:0 6px 0 #2a5ccc;cursor:pointer}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #2a5ccc}
.big-btn:disabled{opacity:.45}
.soft-btn{font:inherit;font-size:clamp(1.05rem,4.5vw,1.3rem);font-weight:600;border:0;border-radius:999px;padding:12px 22px;
  background:#fff;color:var(--ink);box-shadow:0 4px 0 #cdd9ef;cursor:pointer}
.soft-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #cdd9ef}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.bubble{background:#fff;border-radius:24px;padding:12px 20px;font-size:clamp(1.15rem,4.8vw,1.55rem);
  box-shadow:0 4px 14px rgba(40,70,140,.18);max-width:560px;text-align:center}
.bubble.gold{background:#fff6cf}
.uni{width:clamp(150px,45vw,240px);cursor:pointer}
.uni.sm{width:clamp(90px,24vw,130px);flex:none}
.uni.xs{width:clamp(64px,16vw,96px);flex:none}
.uni svg{width:100%;height:auto;display:block}
.bounce{animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-10px)}}
.hop{animation:hop .5s}
@keyframes hop{40%{transform:translateY(-18px) rotate(-4deg)}}

/* name screen */
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:560px}
.chip{font:inherit;font-size:1.25rem;font-weight:600;border:3px solid transparent;border-radius:999px;padding:10px 18px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #cdd9ef}
.chip.on{border-color:var(--purple);background:#e8f0ff}
.name-input{font:inherit;font-size:1.3rem;text-align:center;border:3px solid #cdd9ef;border-radius:999px;padding:10px 18px;width:min(320px,90%);color:var(--ink);outline:none;-webkit-user-select:text;user-select:text}
.name-input:focus{border-color:var(--purple)}

/* map */
.guide{display:flex;align-items:center;gap:10px;width:100%;max-width:760px;margin:4px 0 14px}
.guide .bubble{flex:1;text-align:left}
.map{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:100%;max-width:760px}
.place{font:inherit;color:var(--ink);border:0;border-radius:26px;background:#fff;padding:16px 12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 6px 0 #cdd9ef;min-height:128px;justify-content:center}
.place:active{transform:translateY(4px);box-shadow:0 2px 0 #cdd9ef}
.place .ico{font-size:clamp(2.6rem,12vw,3.6rem);line-height:1}
.place b{font-size:clamp(1.15rem,4.8vw,1.5rem)}
.place small{font-size:clamp(.9rem,3.6vw,1.05rem);color:var(--ink-soft)}
.place.open{background:linear-gradient(160deg,#fff,#eaf2ff);outline:4px solid #bcd4ff}
.place.locked{opacity:.6}
.bar{width:80%;height:12px;border-radius:99px;background:#e3ebf7;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));border-radius:99px}
.wobble{animation:wobble .45s}
@keyframes wobble{20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}

/* game */
.game-head{display:flex;align-items:center;gap:10px;width:100%;max-width:820px}
.game-head .bubble{flex:1}
.dots{display:flex;gap:8px;margin:10px 0 4px}
.dots span{width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px #cdd9ef}
.dots span.done{background:var(--gold);box-shadow:none}
.dots span.now{box-shadow:inset 0 0 0 3px var(--purple)}
.field{flex:1;width:100%;max-width:900px;display:grid;grid-template-columns:repeat(2,1fr);
  gap:clamp(10px,3vw,28px);align-content:center;justify-items:center;padding:8px 0}
.field[hidden]{display:none}
@media (min-width:700px) and (orientation:landscape){.field{grid-template-columns:repeat(4,1fr)}}
.balloon{--c:#ffb3d9;position:relative;width:clamp(118px,36vw,180px);aspect-ratio:5/6;border:0;background:none;padding:0;
  cursor:pointer;font:inherit;color:var(--ink);animation:bob 3.2s ease-in-out infinite;animation-delay:var(--d)}
.balloon::before{content:'';position:absolute;inset:0 0 15% 0;border-radius:50% 50% 47% 47%/56% 56% 44% 44%;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.85) 0 9%,transparent 10%),var(--c);
  box-shadow:inset -10px -14px 0 rgba(0,0,0,.07),0 0 26px rgba(255,255,255,.28)}
.balloon::after{content:'';position:absolute;left:50%;bottom:0;width:2px;height:16%;background:#9aa7c4;transform:translateX(-50%)}
.balloon span{position:absolute;inset:0 0 15% 0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(1.9rem,9vw,2.9rem);font-weight:700;z-index:1}
.balloon.c0{--c:#ffb3d9}.balloon.c1{--c:#d4b8ff}.balloon.c2{--c:#a8e0ff}
.balloon.c3{--c:#b8f0c0}.balloon.c4{--c:#ffe58a}.balloon.c5{--c:#ffc79a}
@keyframes bob{50%{transform:translateY(-12px)}}
.balloon.popped{animation:pop .35s forwards;pointer-events:none}
@keyframes pop{to{transform:scale(1.5);opacity:0}}
.balloon.wobble{animation:wobble .45s}

.say-panel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;width:100%}
.say-panel[hidden]{display:none}
.word-card{background:#fff;border-radius:28px;padding:10px 44px;font-size:clamp(3.2rem,16vw,5.5rem);font-weight:700;
  box-shadow:0 6px 0 #cdd9ef;min-width:200px;text-align:center}
.say-msg{color:#fff;font-size:clamp(1.2rem,5vw,1.6rem);font-weight:600;text-align:center;min-height:2.2em}
.mic-btn{font:inherit;border:0;cursor:pointer;width:clamp(130px,36vw,170px);aspect-ratio:1;border-radius:50%;
  background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;box-shadow:0 7px 0 #2a5ccc;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(2.6rem,11vw,3.4rem)}
.mic-btn span{font-size:clamp(.9rem,3.8vw,1.1rem);font-weight:600;margin-top:2px}
.mic-btn:active{transform:translateY(5px);box-shadow:0 2px 0 #2a5ccc}
.mic-btn.listening{animation:pulse 1s ease-in-out infinite;background:linear-gradient(135deg,#ff6a2e,#ffb03b)}
@keyframes pulse{0%,100%{box-shadow:0 7px 0 #c24a14,0 0 0 0 rgba(255,138,61,.5)}50%{box-shadow:0 7px 0 #c24a14,0 0 0 22px rgba(255,138,61,0)}}

.voice-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:520px}
.voice-row{font:inherit;font-size:1.15rem;color:var(--ink);text-align:left;border:3px solid transparent;border-radius:18px;
  background:#fff;padding:12px 16px;box-shadow:0 3px 0 #cdd9ef;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.voice-row small{color:var(--ink-soft);white-space:nowrap}
.voice-row.on{border-color:var(--purple);background:#e8f0ff}
/* math */
.eq{font-size:clamp(2.4rem,11vw,4rem);font-weight:700;background:#fff;border-radius:24px;padding:2px 28px;box-shadow:0 5px 0 #cdd9ef;margin:8px 0 4px}
.objs{flex:1;display:flex;align-items:center;justify-content:center;align-content:center;gap:clamp(6px,3vw,24px);flex-wrap:wrap;width:100%;max-width:820px}
.grp{display:grid;grid-template-columns:repeat(5,auto);gap:4px;background:rgba(255,255,255,.65);border-radius:20px;padding:10px}
.ob{font-size:var(--os,2.4rem);line-height:1.1;display:inline-block;transition:transform .25s,opacity .4s,filter .4s}
.ob.gone{opacity:.45;filter:grayscale(1);transform:translateY(-8px) scale(.8)}
.ob.lit{transform:scale(1.35);filter:drop-shadow(0 0 6px #ffd34d)}
.sign{color:#fff;font-size:clamp(2rem,9vw,3.2rem);font-weight:700}
.answers{display:flex;gap:clamp(14px,5vw,32px);justify-content:center;margin:10px 0 8px}
.ans{font:inherit;font-size:clamp(2.2rem,10vw,3.2rem);font-weight:700;color:var(--ink);width:clamp(86px,24vw,120px);aspect-ratio:1;
  border-radius:50%;border:0;cursor:pointer;background:var(--c);box-shadow:0 6px 0 rgba(74,59,107,.18)}
.ans:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(74,59,107,.18)}
.ans:disabled{opacity:.35}
.ans.right{background:#8be0a0;transform:scale(1.15);transition:transform .2s}
/* shapes */
.shape-area{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
.shape-big{width:clamp(180px,55vw,300px);background:rgba(255,255,255,.92);border-radius:28px;padding:14px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.shape-big svg,.shape-btn svg{width:100%;height:auto;display:block}
.shape-row{display:flex;gap:clamp(10px,3vw,28px);justify-content:center;flex-wrap:wrap}
.shape-btn{width:clamp(100px,28vw,200px);aspect-ratio:1;border:0;border-radius:24px;background:#fff;padding:10px;cursor:pointer;
  box-shadow:0 6px 0 #cdd9ef;transition:transform .2s}
.shape-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #cdd9ef}
.shape-btn:disabled{opacity:.35}
.shape-btn.right{outline:6px solid #8be0a0;transform:scale(1.08)}
/* clocks */
.clock-big{width:clamp(200px,62vw,330px);filter:drop-shadow(0 6px 0 rgba(0,0,0,.2))}
.clock-big svg,.clock-btn svg{width:100%;height:auto;display:block}
.clock-btn{padding:6px}
.clock-target{font-size:clamp(3rem,15vw,5rem);font-weight:700;background:#fff;color:var(--ink);border-radius:24px;padding:0 30px;margin-bottom:18px;box-shadow:0 6px 0 #cdd9ef;font-variant-numeric:tabular-nums}
.shape-area{flex-direction:column}
.time-btn{font:inherit;font-size:clamp(1.7rem,7.5vw,2.6rem);font-weight:700;color:var(--ink);border:0;border-radius:22px;cursor:pointer;
  padding:12px clamp(12px,4vw,26px);background:var(--c);box-shadow:0 6px 0 rgba(74,59,107,.18);font-variant-numeric:tabular-nums}
.time-btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(74,59,107,.18)}
.time-btn:disabled{opacity:.35}
.time-btn.right{background:#8be0a0;transform:scale(1.12);transition:transform .2s}
/* coins */
.coin-btn{padding:4px}
.coin-btn svg,.coin-big svg,.coin-sm svg{width:100%;height:auto;display:block}
.coin-big{width:clamp(190px,58vw,300px);filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
.coin-row{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:min(560px,100%);
  background:rgba(255,255,255,.9);border-radius:24px;padding:12px}
.coin-sm{width:clamp(62px,17vw,96px);transition:transform .25s}
.coin-sm.lit{transform:scale(1.18);filter:drop-shadow(0 0 8px #ffd34d)}
/* story */
.place.adventure{background:linear-gradient(160deg,#fff,#e6fff1);outline:4px solid #a6f0c6}
.place.world{background:var(--wbg);color:#fff}
.place.world small{color:rgba(255,255,255,.85)}
.place.world.locked{opacity:.55}
.grumble svg{width:100%;height:auto}
.friend-shadow{filter:brightness(.25) drop-shadow(0 0 10px rgba(255,255,255,.4))}
.chapter-head{display:flex;flex-direction:column;align-items:center;color:#fff;margin-bottom:8px}
.chapter-head b{font-size:clamp(1.3rem,5.5vw,1.8rem)}.chapter-head small{font-size:1.05rem;opacity:.85}
.world-map{position:relative;width:100%;max-width:560px;aspect-ratio:3/4;max-height:72dvh;border-radius:28px;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.deco{position:absolute;font-size:clamp(1.4rem,6vw,2.2rem);opacity:.9;pointer-events:none}
.trail{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);width:clamp(48px,13vw,64px);aspect-ratio:1;border-radius:50%;border:4px solid #fff;
  font:inherit;font-weight:700;font-size:1.4rem;color:var(--ink);background:#e3e9f5;box-shadow:0 5px 0 rgba(0,0,0,.25);cursor:pointer;z-index:2}
.node.done{background:#8be0a0}.node.now{background:#ffd34d;animation:pulse2 1.4s ease-in-out infinite}
.node.later{opacity:.7}.node.boss{width:clamp(58px,16vw,78px);font-size:1.7rem}
.node.wobble{animation:wobble .45s}
@keyframes pulse2{50%{box-shadow:0 5px 0 rgba(0,0,0,.25),0 0 0 10px rgba(255,211,77,.35)}}
.nstars{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:.7rem;white-space:nowrap}
.walker{position:absolute;width:clamp(44px,12vw,60px);transform:translate(-50%,-96%);transition:left .5s ease,top .5s ease;z-index:3;pointer-events:none}
.walker svg,.freed svg,.scene svg{width:100%;height:auto;display:block}
.freed{position:absolute;width:clamp(44px,12vw,60px);transform:translate(10%,-110%);z-index:2}
.scene{position:relative;width:100%;max-width:760px;height:clamp(96px,15dvh,140px);border-radius:22px;margin:8px 0 2px;overflow:hidden;flex:none}
.scene-me{position:absolute;left:8%;bottom:-4px;height:96%;aspect-ratio:200/392}
.scene-friend{position:absolute;right:10%;bottom:-4px;height:96%;aspect-ratio:200/392}
.scene-goal{position:absolute;right:12%;bottom:12%;font-size:clamp(2.4rem,10vw,3.4rem)}
.scene-dots{position:absolute;top:6px;left:50%;transform:translateX(-50%);margin:0}
.cage{position:absolute;inset:-4% -18%;display:flex;justify-content:space-around}
.cage i{width:9%;border-radius:8px;background:linear-gradient(#2f8f3a,#1d6b2a);box-shadow:0 0 0 2px #5fc46b inset;transition:transform .5s,opacity .5s}
.cage i.broke{transform:translateY(-120%) rotate(40deg);opacity:0}
.qarea{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:0}
.qarea .field{flex:none}
.qarea .eq{font-size:clamp(2rem,9vw,3.2rem)}
.clock-big.sm{width:clamp(170px,48vw,260px)}
.big-stars{display:flex;gap:10px;font-size:clamp(2.6rem,12vw,3.6rem)}
.big-stars span{filter:grayscale(1) brightness(.6);transition:.3s}.big-stars span.on{filter:none;animation:bump .6s}
.duo{display:flex;gap:6px;align-items:flex-end}
.bubble-cage{--left:5;position:absolute;inset:-14% -40%;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.7) 0 7%,rgba(180,230,255,.18) 8% 60%,rgba(130,210,255,.35) 75%,rgba(255,255,255,.55) 100%);
  border:3px solid rgba(255,255,255,.7);opacity:calc(.35 + var(--left) * .13);transition:opacity .4s,transform .3s}
.bubble-cage i{display:none}
.bubble-cage.popped{transform:scale(1.6);opacity:0;transition:transform .35s,opacity .35s}
.tower{position:absolute;inset:-8% -30% -6%;border-radius:12px 12px 0 0;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 16px),linear-gradient(#d3dae6,#8f9ab0);
  box-shadow:inset 0 0 0 3px #6f7a90;transition:transform .7s ease,opacity .7s}
.tower .door{position:absolute;left:50%;bottom:0;width:46%;height:56%;transform:translateX(-50%);border-radius:40px 40px 0 0;background:#7a4a2a;box-shadow:inset 0 0 0 3px #4e2d17}
.tower .locks{position:absolute;left:0;right:0;top:6%;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:clamp(.8rem,3.4vw,1.1rem)}
.tower .locks i{font-style:normal;transition:transform .3s}.tower .locks i.open{transform:scale(1.25)}
.tower.opened{transform:translateY(105%);opacity:0}
.lights{position:absolute;top:22px;left:0;right:0;display:flex;justify-content:space-evenly}
.lights i{width:clamp(16px,4vw,22px);aspect-ratio:1;border-radius:50%;background:#3a2020;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25);transition:.3s}
.lights i.on{background:#ffe066;box-shadow:0 0 14px 6px rgba(255,224,102,.7)}
.band{position:absolute;left:0;right:0;bottom:-4px;height:74%;display:flex;justify-content:center;gap:2%}
.band span{height:100%;aspect-ratio:200/392}
.band.big{position:static;height:auto;gap:4px;align-items:flex-end}
.band.big span{width:clamp(66px,20vw,110px);height:auto;aspect-ratio:auto;display:flex;flex-direction:column;align-items:center;animation:bounce 1.6s ease-in-out infinite}
.band.big small{color:#fff;font-weight:700;font-size:clamp(.85rem,3.6vw,1.05rem)}
.band svg{width:100%;height:auto;display:block}
/* dressing room */
.closet{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:640px}
.uni.preview{width:clamp(120px,34vw,180px);cursor:default}
.uni.full{width:clamp(120px,34vw,190px)}
.tabs{max-width:100%;overflow-x:auto;scrollbar-width:none}

<body>
<div id="app">
  <header class="topbar" id="topbar" hidden>
    <button class="icon-btn" id="homeBtn" aria-label="Home">🏠</button>
    <div class="row"><button class="icon-btn" id="setBtn" aria-label="Grown-up settings">⚙️</button>
    <div class="gems" id="gems">💎 <span id="gemCount">0</span></div></div>
  </header>
  <main id="screen"></main>
</div>

<script>
/* ---------- Word lists (Dolch) ---------- */
const WORDS = [
  ['a','and','away','big','blue','can','come','down','find','for','funny','go','help','here','I','in','is','it','jump','little','look','make','me','my','not','one','play','red','run','said','see','the','three','to','two','up','we','where','yellow','you'],
  ['all','am','are','at','ate','be','black','brown','but','came','did','do','eat','four','get','good','have','he','into','like','must','new','no','now','on','our','out','please','pretty','ran','ride','saw','say','she','so','soon','that','there','they','this','too','under','want','was','well','went','what','white','who','will','with','yes'],
  ['after','again','an','any','as','ask','by','could','every','fly','from','give','going','had','has','her','him','his','how','just','know','let','live','may','of','old','once','open','over','put','round','some','stop','take','thank','them','then','think','walk','were','when']
];
const LEVEL_NAMES = ['Rookie Track','Pro Track','Champion Track'];
// Words that sound the same can't be told apart by ear, so never show them together.
const SAME_SOUND = [['to','two','too'],['for','four'],['no','know']];
// What the speech recognizer may write when she says the word correctly.
const SOUNDS_LIKE = {
  to:['two','too','2'], two:['to','too','2'], too:['to','two','2'],
  for:['four','4','fore'], four:['for','4'], one:['won','1'], three:['3'],
  i:['eye','aye'], be:['bee','b'], see:['sea','c'], no:['know'], know:['no'],
  new:['knew'], blue:['blew'], here:['hear'], there:['their',"they're"],
  ate:['eight','8'], by:['buy','bye'], a:['uh','ah','eh'], red:['read'],
  so:['sew','sow'], our:['hour','are'], are:['our','r'], yes:['yeah','yep'],
  you:['u'], we:['wee'], some:['sum'], him:['hymn']
};

/* ---------- Saved progress (on this device) ---------- */
const KEY = 'ian-learns-v1';
const DEFAULTS = { guideName:'', gems:0, level:0, rounds:0, words:{}, voiceName:'', math:{ stage:0, recent:[] }, count:{ stage:0, recent:[] }, shape:{ stage:0, recent:[] }, clock:{ stage:0, recent:[] }, coin:{ stage:0, recent:[] },
  look:null, owned:null, chests:0, house:null, stats:{}, days:{}, played:0, pet:null, pets:[],
  story:{ chapter:0, level:0, stars:{}, friends:['', '', ''] } };
function load(){
  try { return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem(KEY) || '{}')); }
  catch(e){ return JSON.parse(JSON.stringify(DEFAULTS)); }
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
let S = load();

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const screen = $('#screen');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* ---------- Voice (unicorn talks) ---------- */
let voice = null;
// Higher score = more natural sounding. Novelty and old robotic voices are pushed down.
function voiceScore(v){
  const n = v.name; let s = 0;
  if (/natural|neural|premium|enhanced/i.test(n)) s += 50;
  if (/online/i.test(n)) s += 10;
  if (/Ava|Aria|Jenny|Emma|Michelle|Samantha|Allison|Zoe|Google US English/i.test(n)) s += 20;
  if (/en[-_]US/i.test(v.lang)) s += 15; else if (/^en/i.test(v.lang)) s += 5;
  if (/David|Zira|Mark|Fred|Albert|Bad News|Bells|Boing|Bubbles|Cellos|Wobble|Whisper|Zarvox|Trinoids|Jester|Organ|Superstar|Ralph|Kathy|Junior|Grandpa|Grandma|Rocko|Shelley|Flo|Eddy|Reed|Sandy/i.test(n)) s -= 40;
  return s;
}
function englishVoices(){
  return speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)).sort((a, b) => voiceScore(b) - voiceScore(a));
}
function pickVoice(){
  const vs = englishVoices();
  voice = vs.find(v => v.name === S.voiceName) || vs[0] || null;
}
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
/* Natural voice: recorded clips in audio/ (made by voice/make_voices.py). Each sentence is looked up;
   anything without a clip is spoken by the device voice instead. */
let CLIPS = null, voiceTok = 0, clipAudio = null;
try { fetch('audio/manifest.json', { cache:'no-cache' }).then(r => r.ok ? r.json() : null).then(m => { CLIPS = m; }).catch(() => {}); } catch(e){}
const vkey = (t, slow) => (slow ? 'slow:' : '') + String(t).toLowerCase().replace(/[‘’]/g, "'").replace(/\s+/g, ' ').trim();
function segments(text){ // sentences; a counting list like "4, 5, 6!" becomes single numbers
  const out = [];
  (String(text).match(/[^.!?:]+[.!?:]*/g) || []).forEach(s0 => {
    const t = s0.trim(); if (!t) return;
    if (/^(\d+|hmm)(\s*,\s*(\d+|hmm))+[.!?]*$/i.test(t)) t.replace(/[.!?]/g, '').split(',').forEach(n => out.push(n.trim()));
    else if (/^\d+[.!?]+$/.test(t)) out.push(t.replace(/[.!?]/g, ''));   // a lone number like "12." uses the number clip
    else out.push(t);
  });
  return out;
}
function stopVoice(){
  voiceTok++;
  try { if (clipAudio){ clipAudio.pause(); clipAudio = null; } } catch(e){}
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}
function playClip(file, tok){
  return new Promise(res => {
    if (tok !== voiceTok) return res(true);
    let done = false; const fin = ok => { if (!done){ done = true; res(ok); } };
    try {
      const a = new Audio('audio/' + file); clipAudio = a;
      a.onended = () => fin(true); a.onerror = () => fin(false);
      setTimeout(() => fin(true), 9000);
      const pr = a.play(); if (pr && pr.catch) pr.catch(() => fin(false));
    } catch(e){ fin(false); }
  });
}
async function say(text, opts = {}){
  stopVoice(); const tok = voiceTok;
  const slow = !!opts.rate && opts.rate < .9;
  if (!CLIPS || S.natural === false) return ttsOnce(text, opts);
  const segs = segments(text), files = segs.map(sg => CLIPS[vkey(sg, slow)]);
  if (!files.some(Boolean)) return ttsOnce(text, opts);
  for (let k = 0; k < segs.length; k++){
    if (tok !== voiceTok) return;
    const ok = files[k] ? await playClip(files[k], tok) : false;
    if (!ok && tok === voiceTok) await ttsOnce(segs[k], opts);
  }
}
function ttsOnce(text, opts = {}){
  text = String(text ?? '');
  return new Promise(res => {
    if (!('speechSynthesis' in window)) return res();
    const u = new SpeechSynthesisUtterance(text);
    if (voice) u.voice = voice;
    u.lang = voice ? voice.lang : 'en-US'; u.rate = opts.rate || 0.95; u.pitch = 1.05;
    let done = false; const fin = () => { if (!done){ done = true; res(); } };
    u.onend = fin; u.onerror = fin;
    setTimeout(fin, 2000 + text.length * 110);
    speechSynthesis.speak(u);
  });
}
const sayWord = w => say(w, { rate: 0.72 });

/* ---------- Microphone (Ian talks) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let micBlocked = false;
function listen(){
  return new Promise(res => {
    if (!SR) return res({ ok:false, err:'unsupported' });
    const r = new SR();
    r.lang = 'en-US'; r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
    const alts = []; let done = false;
    const fin = o => { if (done) return; done = true; clearTimeout(t); try { r.abort(); } catch(e){} res(o); };
    r.onresult = e => { for (const result of e.results) for (const alt of result) alts.push(alt.transcript); fin({ ok:true, alts }); };
    r.onerror = e => fin({ ok:false, err:e.error, alts });
    r.onend = () => fin({ ok:true, alts });
    const t = setTimeout(() => fin({ ok:true, alts }), 6000);
    try { r.start(); } catch(e){ fin({ ok:false, err:'start', alts }); }
  });
}
const tokens = s => s.toLowerCase().replace(/[^a-z0-9' ]/g, ' ').split(/\s+/).filter(Boolean);
function heard(word, alts){
  const w = word.toLowerCase();
  const ok = new Set([w, ...(SOUNDS_LIKE[w] || [])]);
  return alts.some(a => tokens(a).some(t => ok.has(t)));
}

/* ---------- Sounds ---------- */
let ac;
function tone(freqs, dur = .12, type = 'sine'){
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t0 = ac.currentTime;
    freqs.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t0 + i*dur);
      g.gain.exponentialRampToValueAtTime(.22, t0 + i*dur + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + i*dur + dur);
      o.connect(g).connect(ac.destination);
      o.start(t0 + i*dur); o.stop(t0 + i*dur + dur + .05);
    });
  } catch(e){}
}
const sfx = {
  pop:   () => tone([620, 940], .07, 'triangle'),
  chime: () => tone([660, 880, 1320], .12),
  oops:  () => tone([320, 250], .12, 'triangle'),
  tada:  () => tone([523, 659, 784, 1047], .13),
  sparkle: () => tone([1319, 1760, 2093, 2637], .07),
  knock: () => tone([200, 150], .09, 'square'),
  cheer: () => { // a short crowd cheer made from filtered noise
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const len = Math.floor(ac.sampleRate * 1.6), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let k = 0; k < len; k++) d[k] = (Math.random() * 2 - 1) * (0.65 + 0.35 * Math.sin(k / ac.sampleRate * 47));
      const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime;
      src.buffer = buf; f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = .6;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.3, t + .2); g.gain.exponentialRampToValueAtTime(.0001, t + 1.6);
      src.connect(f).connect(g).connect(ac.destination); src.start();
    } catch(e){}
  }
};
function confetti(n = 30){
  const cols = ['#ff8fc8','#b794f6','#7fd1ff','#ffd34d','#8be0a0'];
  for (let k = 0; k < n; k++){
    const d = document.createElement('i');
    d.className = 'conf';
    d.style.left = Math.random()*100 + 'vw';
    d.style.background = cols[k % cols.length];
    d.style.animationDuration = (1.1 + Math.random()*1.2) + 's';
    d.style.animationDelay = (Math.random()*.3) + 's';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 3000);
  }
}

/* ---------- Ian's avatar (full body, dressable) ---------- */
// Every item fills one slot. Optional slots (head, face, neck, back, hand, ride) can be taken off.
const ITEMS = [
  // hair styles
  { id:'swoop', slot:'hairStyle', name:"Ian's Swoop", cost:0 },
  { id:'spiky', slot:'hairStyle', name:'Spiky',       cost:30 },
  { id:'buzz',  slot:'hairStyle', name:'Buzz Cut',    cost:30 },
  { id:'hawk',  slot:'hairStyle', name:'Faux Hawk',   cost:40 },
  { id:'curly', slot:'hairStyle', name:'Curly Top',   cost:35 },
  { id:'mop',   slot:'hairStyle', name:'Shaggy',      cost:35 },
  // hair colors
  { id:'hn', slot:'hairColor', name:'Natural',   cost:0,  c:['#2b1e19','#110b09'] },
  { id:'hb', slot:'hairColor', name:'Brown',     cost:25, c:['#8a5a3b','#4e301e'] },
  { id:'h1', slot:'hairColor', name:'Sky Blue',  cost:30, c:['#7fd8ff','#3f6fe8'] },
  { id:'h3', slot:'hairColor', name:'Lime',      cost:30, c:['#c4f56b','#3fbf4a'] },
  { id:'h0', slot:'hairColor', name:'Fire',      cost:35, c:['#ffb03b','#ff4a2e'] },
  { id:'h2', slot:'hairColor', name:'Gold',      cost:30, c:['#ffe066','#e0a000'] },

/* ---------- Word progress (spaced practice) ---------- */
// Each word has a "box" 0-5. 0 = not met yet, 1 = learning, 5 = mastered.
// Words she knows move up fast and come back rarely; misses drop to box 1 and come back soon.
const ALL_WORDS = WORDS.flat();
const GAP = [0, 1, 2, 4, 8, 16];          // rounds to wait before showing a word again, by box
const MAX_LEARNING = 6;                    // how many shaky words she juggles at once
// A short sentence for words that sound like other words, so she knows which one to find.
const CLUES = {
  to:'I go to school.', two:'I have two hands.', too:'Me too!',
  for:'This gift is for you.', four:'A dog has four legs.',
  no:'No, thank you.', know:'I know the answer.',
  one:'I have one nose.', there:'Look over there.', here:'Come here.',
  be:'Be nice.', see:'I see you.', ate:'I ate my lunch.', by:'Sit by me.',
  red:'My shirt is red.', blue:'The sky is blue.', new:'I have new shoes.',
  our:'This is our house.', are:'We are friends.', some:'I want some.', him:'Give it to him.',
  so:'I am so happy.', I:'I am happy.'
};
function st(w){
  const o = S.words[w] || (S.words[w] = { box:0, due:0, seen:0, right:0, miss:0, said:0 });
  if (o.box === undefined){ // progress saved by the first version
    o.box = (o.streak || 0) >= 3 ? 4 : (o.streak || 0) >= 1 ? 3 : (o.seen || o.miss) ? 1 : 0;
    o.due = 0; delete o.streak;
  }
  return o;
}
const box = w => (S.words[w] ? st(w).box : 0);
const met = w => box(w) > 0;
const mastered = w => box(w) >= 3;
const upcoming = n => ALL_WORDS.filter(w => !met(w)).slice(0, n);
const sameSound = w => (SAME_SOUND.find(g => g.includes(w)) || [w]);
function wordFloor(){ // which list she is on: the list of the next new word
  const nxt = upcoming(1)[0];
  return nxt ? WORDS.findIndex(l => l.includes(nxt)) : WORDS.length - 1;
}
function levelPct(){ const cur = WORDS[wordFloor()]; return Math.round(cur.filter(mastered).length / cur.length * 100); }

function pickRound(n){
  const R = S.rounds;
  const seen = ALL_WORDS.filter(met);
  const learning = seen.filter(w => box(w) <= 2).sort((a, b) => st(a).due - st(b).due || st(b).miss - st(a).miss);
  const reviews = seen.filter(w => box(w) >= 3 && st(w).due <= R).sort((a, b) => st(a).due - st(b).due);
  const out = [];
  const add = w => { if (w && !out.includes(w) && out.length < n) out.push(w); };
  learning.filter(w => st(w).due <= R).slice(0, 3).forEach(add);           // shaky words that are due
  const room = Math.max(0, MAX_LEARNING - learning.length);
  upcoming(Math.min(room, n - out.length - (reviews.length ? 1 : 0), 3)).forEach(add); // a few new words
  reviews.slice(0, 2).forEach(add);                                          // a quick check on known words
  learning.forEach(add);                                                     // fill: other shaky words
  upcoming(n).forEach(add);                                                  // fill: more new words
  seen.sort((a, b) => st(a).due - st(b).due).forEach(add);                   // fill: soonest reviews
  return shuffle(out);
}
function distractors(w, n){
  const block = sameSound(w);
  const pool = shuffle([...new Set([...ALL_WORDS.filter(met), ...upcoming(12)])].filter(x => x !== w && !block.includes(x)));
  const out = [];
  const lookAlike = pool.find(x => x[0].toLowerCase() === w[0].toLowerCase());
  if (lookAlike) out.push(lookAlike);
  for (const x of pool){
    if (out.length >= n) break;
    if (!out.includes(x) && !out.some(o => sameSound(o).includes(x))) out.push(x);
  }
  return out;
}
// Called once per word per round, the first time she sees it.
function scoreWord(w, firstTry, saidOk){
  const o = st(w), R = S.rounds; logAns('word', firstTry);
  o.seen++;
  if (firstTry){
    o.right++;
    o.box = o.box === 0 ? 3 : Math.min(5, o.box + 1);   // new word she already knows: skip ahead
    if (saidOk === false) o.box = Math.min(o.box, 2);     // couldn't say it: keep it close
  } else {
    o.miss++; o.box = 1;
  }
  o.due = R + GAP[o.box];
}

/* ---------- Math (Number Garden) ---------- */
const MATH_STAGES = [
  { name:'Add to 5',        ops:['+'],     max:5 },
  { name:'Add to 10',       ops:['+'],     max:10 },
  { name:'Take away to 10', ops:['-'],     max:10 },
  { name:'Mix to 10',       ops:['+','-'], max:10 },
  { name:'Add to 20',       ops:['+'],     max:20 },
  { name:'Take away to 20', ops:['-'],     max:20 },
  { name:'Mix to 20',       ops:['+','-'], max:20 }
];
const rand = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
function makeProblem(seen){
  const st = MATH_STAGES[S.math.stage];
  for (let t = 0; t < 60; t++){
    const op = pick(st.ops); let a, b;
    if (op === '+'){ a = rand(1, st.max - 1); b = rand(1, st.max - a); if (st.max === 20 && a + b < 11) continue; }
    else { a = rand(st.max === 20 ? 11 : 3, st.max); b = rand(1, a - 1); }
    const key = a + op + b; if (seen.has(key)) continue; seen.add(key);
    return { a, b, op, ans: op === '+' ? a + b : a - b };
  }
  return { a:1, b:1, op:'+', ans:2 };
}
function mathChoices(p){
  const c = new Set([p.ans]);
  const near = shuffle([p.ans - 1, p.ans + 1, p.ans - 2, p.ans + 2]).filter(x => x >= 0 && x <= 20);
  for (const x of near){ if (c.size >= 3) break; c.add(x); }
  while (c.size < 3) c.add(rand(0, 20));
  return shuffle([...c]);
}
function checkMathUp(){
  const m = S.math;
  if (m.stage >= MATH_STAGES.length - 1) return null;
  const last = m.recent.slice(-8);
  if (last.length >= 8 && last.reduce((x, y) => x + y, 0) >= 7){
    m.stage++; m.recent = [];
    return `Star Math level ${m.stage + 1}: ${MATH_STAGES[m.stage].name}`;
  }
  return null;
}
const mathPct = () => Math.round(S.math.stage / (MATH_STAGES.length - 1) * 100);

/* ---------- Counting (Count to 100) ---------- */
const COUNT_STAGES = [
  { name:'Next number to 20',  step:1,  min:1,  max:20,  pos:'end' },
  { name:'Next number to 50',  step:1,  min:15, max:50,  pos:'end' },
  { name:'Next number to 100', step:1,  min:40, max:100, pos:'end' },
  { name:'Missing number',     step:1,  min:1,  max:100, pos:'any' },
  { name:'Count by 10s',       step:10, max:100, pos:'any' },
  { name:'Count by 5s',        step:5,  max:100, pos:'any' },
  { name:'Count by 2s',        step:2,  max:50,  pos:'any' }
];
function makeCount(seen){
  const st = COUNT_STAGES[S.count.stage], s = st.step;
  for (let t = 0; t < 80; t++){
    let start;
    if (s === 1){
      start = rand(st.min, st.max - 4);
      // half the time, cross a ten (like 27, 28, 29, 30) since that's the tricky part
      if (Math.random() < .5) start = Math.min(st.max - 4, Math.max(st.min, start - (start % 10) + rand(6, 9)));
    } else start = s * rand(0, st.max / s - 4);
    const seq = [0, 1, 2, 3, 4].map(k => start + k * s);
    const miss = st.pos === 'end' ? 4 : rand(1, 4);
    const key = start + '-' + miss; if (seen.has(key)) continue; seen.add(key);
    return { seq, miss, ans: seq[miss], step: s };
  }
  return { seq:[1,2,3,4,5], miss:4, ans:5, step:1 };
}
function countChoices(p){
  const c = new Set([p.ans]);
  const near = shuffle([p.ans + p.step, p.ans - p.step, p.ans + 1, p.ans - 1, p.ans + 10, p.ans - 10])
    .filter(x => x >= 0 && x <= 120 && x !== p.ans);
  for (const x of near){ if (c.size >= 3) break; c.add(x); }
  return shuffle([...c]);
}
function checkCountUp(){
  const m = S.count;
  if (m.stage >= COUNT_STAGES.length - 1) return null;
  const last = m.recent.slice(-8);
  if (last.length >= 8 && last.reduce((x, y) => x + y, 0) >= 7){
    m.stage++; m.recent = [];
    return `Count to 100 level ${m.stage + 1}: ${COUNT_STAGES[m.stage].name}`;
  }
  return null;
}
const countPct = () => Math.round(S.count.stage / (COUNT_STAGES.length - 1) * 100);

function countGame(){
  setTop(true, true);
  const my = nav, N = 8, seen = new Set();
  let i = 0, earned = 0, speakIt = null;
  screen.innerHTML = `
    <div class="game-head">
      <div class="uni xs">${guideSVG()}</div>
      <div class="bubble" id="prompt"></div>
      <button class="icon-btn" id="hear" aria-label="Hear it again">🔊</button>
    </div>
    <div class="dots" id="dots">${'<span></span>'.repeat(N)}</div>
    <div class="stones" id="stones"></div>
    <div class="answers" id="answers"></div>`;
  const stones = $('#stones'), answers = $('#answers'), prompt = $('#prompt');
  $('#hear').onclick = () => speakIt && speakIt();
  const COLORS = ['#ffb3d9','#d4b8ff','#a8e0ff','#b8f0c0','#ffe58a','#ffc79a'];

  function next(){
    if (my !== nav) return;
    if (i >= N) return roundDone(earned, checkCountUp(), countGame);
    screen.querySelectorAll('#dots span').forEach((d, k) => { d.className = k < i ? 'done' : k === i ? 'now' : ''; });
    const p = makeCount(seen);
    let firstTry = true, solved = false, busy = false;
    const atEnd = p.miss === p.seq.length - 1;
    prompt.textContent = atEnd ? 'What comes next?' : 'What number is missing?';
    stones.innerHTML = p.seq.map((n, k) => k === p.miss
      ? `<span class="stone miss">?</span>`
      : `<span class="stone" style="--c:${COLORS[k % COLORS.length]}">${n}</span>`).join('');
    const spoken = p.seq.map((n, k) => k === p.miss ? 'hmm' : n).join(', ');
    speakIt = () => say(atEnd ? `${p.seq.slice(0, -1).join(', ')}. What comes next?` : `${spoken}. What number is missing?`);
    speakIt();
    answers.innerHTML = countChoices(p).map((n, k) =>
      `<button class="ans" data-n="${n}" style="--c:${COLORS[(i * 2 + k + 3) % COLORS.length]}">${n}</button>`).join('');

    answers.querySelectorAll('.ans').forEach(b => b.onclick = async () => {
      if (solved || busy) return;
      const n = +b.dataset.n;
      const missEl = stones.children[p.miss];
      if (n === p.ans){
        solved = true;
        b.classList.add('right'); sfx.tada(); confetti(20);
        missEl.classList.remove('miss'); missEl.style.setProperty('--c', '#8be0a0'); missEl.textContent = p.ans;
        logAns('count', firstTry); S.count.recent.push(firstTry ? 1 : 0); S.count.recent = S.count.recent.slice(-10);
        if (firstTry){ earned += lucky(); }
        save();
        await say(`Yes! ${p.seq.join(', ')}!`);
        i++; setTimeout(next, 300);
      } else {
        firstTry = false; busy = true;
        b.classList.remove('wobble'); void b.offsetWidth; b.classList.add('wobble'); b.disabled = true; sfx.oops();
        await say("Let's count together!");
        const els = [...stones.children];
        for (let k = 0; k < p.miss; k++){
          if (my !== nav) return;
          els[k].classList.add('lit');
          await say(String(p.seq[k]), { rate:1.05 });
        }
        if (my !== nav) return;
        els[p.miss].classList.add('lit');
        await say('What comes after?');
        els.forEach(x => x.classList.remove('lit'));
        busy = false;
      }
    });
  }
  next();
}

function mathGame(){

    const p = makeProblem(seen);
    let firstTry = true, solved = false, busy = false;
    const sym = p.op === '+' ? '+' : '−';
    const words = p.op === '+' ? `${p.a} plus ${p.b}` : `${p.a} take away ${p.b}`;
    eq.textContent = `${p.a} ${sym} ${p.b} = ?`;

    speakIt = () => say(`What is ${words}?`);

      `<button class="ans" data-n="${n}" style="--c:${COLORS[(i * 3 + k) % COLORS.length]}">${n}</button>`).join('');

      if (n === p.ans){
        solved = true;
        b.classList.add('right'); sfx.tada(); confetti(20);
        logAns('math', firstTry); S.math.recent.push(firstTry ? 1 : 0); S.math.recent = S.math.recent.slice(-10);
        if (firstTry){ earned += lucky(); }
        save();
        eq.textContent = `${p.a} ${sym} ${p.b} = ${p.ans}`;
        await say(`${words} is ${p.ans}!`);
        i++; setTimeout(next, 300);
      } else {
        firstTry = false; busy = true;
        b.classList.remove('wobble'); void b.offsetWidth; b.classList.add('wobble'); b.disabled = true; sfx.oops();
        await say("Let's count together!");
        const nodes = [...objs.querySelectorAll('.ob:not(.gone)')];
        for (let k = 0; k < nodes.length; k++){

          nodes[k].classList.add('lit');

        }
        if (my !== nav) return;
        await say('Now you try!');
        nodes.forEach(x => x.classList.remove('lit'));
        busy = false;
      }
    });
  }
  next();
}

function clockGame(){
  setTop(true, true);
  const my = nav, N = 8, st = CLOCK_STAGES[S.clock.stage];
  let i = 0, earned = 0, speakIt = null, last = null;
  screen.innerHTML = `
    <div class="game-head">
      <div class="uni xs">${guideSVG()}</div>
      <div class="bubble" id="prompt"></div>
      <button class="icon-btn" id="hear" aria-label="Hear it again">🔊</button>
    </div>
    <div class="dots" id="dots">${'<span></span>'.repeat(N)}</div>
    <div class="shape-area" id="area"></div>
    <div class="answers" id="answers"></div>`;
  const area = $('#area'), answers = $('#answers'), prompt = $('#prompt');
  $('#hear').onclick = () => speakIt && speakIt();
  const COLORS = ['#ffb3d9','#d4b8ff','#a8e0ff','#b8f0c0','#ffe58a','#ffc79a'];

  function record(firstTry){
    logAns('clock', firstTry); S.clock.recent.push(firstTry ? 1 : 0); S.clock.recent = S.clock.recent.slice(-10);
    if (firstTry){ earned += lucky(); }
    save();
  }
  async function hint(t, show){
    // show(hl) redraws the clock with the hour or minute hand glowing
    show('hour');
    await say(`The short hand points to the hour. It's on ${t.h}.`);
    if (my !== nav) return false;
    show('min');
    await say(t.m === 0 ? `The long hand is on 12. That means o'clock.` : `The long hand is on 6. That means thirty.`);
    if (my !== nav) return false;
    show(null);
    await say(`So it's ${timeSay(t.h, t.m)}! Now you try!`);
    return my === nav;
  }
  function next(){
    if (my !== nav) return;
    if (i >= N) return roundDone(earned, trackUp(S.clock, CLOCK_STAGES, 'Clocks'), clockGame);
    screen.querySelectorAll('#dots span').forEach((d, k) => { d.className = k < i ? 'done' : k === i ? 'now' : ''; });
    const t = makeTime(st, last); last = t;
    const mode = st.mode === 'mix' ? pick(['read', 'match']) : st.mode;
    const opts = timeChoices(t, st);
    let firstTry = true, solved = false, busy = false;

    if (mode === 'read'){
      prompt.textContent = 'What time is it?';
      speakIt = () => say('What time is it?');
      const show = hl => { area.innerHTML = `<div class="clock-big">${clockSVG(t.h, t.m, hl)}</div>`; };
      show(null);
      answers.innerHTML = opts.map((o, k) =>
        `<button class="time-btn" data-k="${k}" style="--c:${COLORS[(i * 2 + k) % COLORS.length]}">${timeText(o.h, o.m)}</button>`).join('');
      speakIt();
      answers.querySelectorAll('.time-btn').forEach(b => b.onclick = async () => {
        if (solved || busy) return;
        const o = opts[+b.dataset.k];
        if (o.h === t.h && o.m === t.m){
          solved = true; b.classList.add('right'); sfx.tada(); confetti(20); record(firstTry);
          await say(`Yes! It's ${timeSay(t.h, t.m)}!`);
          i++; setTimeout(next, 300);
        } else {
          firstTry = false; busy = true;
          b.classList.remove('wobble'); void b.offsetWidth; b.classList.add('wobble'); b.disabled = true; sfx.oops();
          if (await hint(t, show)) busy = false;
        }
      });
    } else {
      prompt.textContent = `Find ${timeText(t.h, t.m)}!`;
      speakIt = () => say(`Find the clock that says ${timeSay(t.h, t.m)}!`);
      answers.innerHTML = '';
      area.innerHTML = `<div class="clock-target">${timeText(t.h, t.m)}</div>
        <div class="shape-row">${opts.map((o, k) => `<button class="shape-btn clock-btn" data-k="${k}">${clockSVG(o.h, o.m)}</button>`).join('')}</div>`;
      speakIt();
      area.querySelectorAll('.clock-btn').forEach(b => b.onclick = async () => {
        if (solved || busy) return;
        const o = opts[+b.dataset.k];
        if (o.h === t.h && o.m === t.m){
          solved = true; b.classList.add('right'); sfx.tada(); confetti(20); record(firstTry);
          await say(`Yes! That clock says ${timeSay(t.h, t.m)}!`);
          i++; setTimeout(next, 300);
        } else {
          firstTry = false; busy = true;
          b.classList.remove('wobble'); void b.offsetWidth; b.classList.add('wobble'); b.disabled = true; sfx.oops();
          await say(`That clock says ${timeSay(o.h, o.m)}. Find ${timeSay(t.h, t.m)}!`);
          busy = false;
        }
      });
    }
  }
  next();
}

function coinGame(){
  setTop(true, true);
  const my = nav, N = 8, st = COIN_STAGES[S.coin.stage];
  let i = 0, earned = 0, speakIt = null, lastKind = null;
  screen.innerHTML = `
    <div class="game-head">
      <div class="uni xs">${guideSVG()}</div>
      <div class="bubble" id="prompt"></div>
      <button class="icon-btn" id="hear" aria-label="Hear it again">🔊</button>
    </div>
    <div class="dots" id="dots">${'<span></span>'.repeat(N)}</div>
    <div class="shape-area" id="area"></div>
    <div class="answers" id="answers"></div>`;
  const area = $('#area'), answers = $('#answers'), prompt = $('#prompt');
  $('#hear').onclick = () => speakIt && speakIt();
  const COLORS = ['#ffb3d9','#d4b8ff','#a8e0ff','#b8f0c0','#ffe58a','#ffc79a'];

  function record(firstTry){
    logAns('coin', firstTry); S.coin.recent.push(firstTry ? 1 : 0); S.coin.recent = S.coin.recent.slice(-10);
    if (firstTry){ earned += lucky(); }
    save();
  }
  function wrongTap(b){
    b.classList.remove('wobble'); void b.offsetWidth; b.classList.add('wobble'); b.disabled = true; sfx.oops();
  }
  function centButtons(choices, onPick){
    answers.innerHTML = choices.map((c, k) =>
      `<button class="time-btn" data-n="${c}" style="--c:${COLORS[(i * 2 + k) % COLORS.length]}">${c}¢</button>`).join('');
    answers.querySelectorAll('.time-btn').forEach(b => b.onclick = () => onPick(b, +b.dataset.n));
  }
  function next(){
    if (my !== nav) return;
    if (i >= N) return roundDone(earned, trackUp(S.coin, COIN_STAGES, 'Coins'), coinGame);
    screen.querySelectorAll('#dots span').forEach((d, k) => { d.className = k < i ? 'done' : k === i ? 'now' : ''; });
    let firstTry = true, solved = false, busy = false;
    const done = async (b, line) => {
      solved = true; b.classList.add('right'); sfx.tada(); confetti(20); record(firstTry);
      await say(line); i++; setTimeout(next, 300);
    };

    if (st.mode === 'find' || st.mode === 'value'){
      let kind; do { kind = pick(COIN_ORDER); } while (kind === lastKind);
      lastKind = kind;
      const v = COINS[kind].v;
      if (st.mode === 'find'){
        const opts = shuffle([kind, ...shuffle(COIN_ORDER.filter(x => x !== kind)).slice(0, 2)]);
        prompt.textContent = `Find the ${kind}!`;
        speakIt = () => say(`Find the ${kind}!`);
        answers.innerHTML = '';
        area.innerHTML = `<div class="shape-row">${opts.map(o => `<button class="shape-btn coin-btn" data-c="${o}">${coinSVG(o)}</button>`).join('')}</div>`;
        speakIt();
        area.querySelectorAll('.coin-btn').forEach(b => b.onclick = async () => {
          if (solved || busy) return;
          const o = b.dataset.c;
          if (o === kind) return done(b, `Yes! That's a ${kind}. It's worth ${centsSay(v)}!`);
          firstTry = false; busy = true; wrongTap(b);
          await say(`That's a ${o}. Find the ${kind}!`);
          busy = false;
        });
      } else {
        prompt.textContent = 'How much is it worth?';
        speakIt = () => say(`How much is a ${kind} worth?`);
        area.innerHTML = `<div class="coin-big">${coinSVG(kind)}</div>`;
        const choices = shuffle([v, ...shuffle([1, 5, 10, 25].filter(x => x !== v)).slice(0, 2)]);
        speakIt();
        centButtons(choices, async (b, n) => {
          if (solved || busy) return;
          if (n === v) return done(b, `Yes! A ${kind} is worth ${centsSay(v)}!`);
          firstTry = false; busy = true; wrongTap(b);
          await say(`Not quite. A ${kind} is worth ${centsSay(v)}. Now you try!`);
          busy = false;
        });
      }
    } else {
      const coins = makeCoins(st);
      const total = coins.reduce((x, c) => x + COINS[c].v, 0);
      const smallest = Math.min(...coins.map(c => COINS[c].v));
      prompt.textContent = 'How much money?';
      speakIt = () => say('How much money is this?');
      area.innerHTML = `<div class="coin-row">${coins.map(c => `<span class="coin-sm">${coinSVG(c)}</span>`).join('')}</div>`;
      speakIt();
      centButtons(centChoices(total, smallest), async (b, n) => {
        if (solved || busy) return;
        if (n === total) return done(b, `Yes! That's ${centsSay(total)}!`);
        firstTry = false; busy = true; wrongTap(b);
        await say("Let's count it together!");
        const els = [...area.querySelectorAll('.coin-sm')];
        let run = 0;
        for (let k = 0; k < coins.length; k++){
          if (my !== nav) return;
          run += COINS[coins[k]].v;
          els[k].classList.add('lit');
          await say(String(run), { rate:1.05 });
        }
        if (my !== nav) return;
        await say('Now you try!');
        els.forEach(x => x.classList.remove('lit'));
        busy = false;
      });
    }
  }
  next();

function itemSwatch(it){

function rollPrize(){
  const free = ITEMS.filter(it => (it.cost > 0 || it.chest) && !S.owned.includes(it.id));
  const secret = free.filter(it => it.chest);
  if (secret.length && Math.random() < .2) return { item: pick(secret) };
  if (free.length && Math.random() < .5) return { item: pick(free) };
  return { gems: pick([['blue'], ['blue','blue'], ['gold'], ['blue','blue','blue'], ['gold','blue']]) };
}
// Shows a chest next to Ian on a "you did it" screen. Tap it 3 times to crack it open.
function offerChest(chance, after){
  const spot = $('#chestSpot');
  if (!spot || (S.chests > 0 && Math.random() >= chance)) return false;
  const my = nav;
  spot.innerHTML = `<button class="chest" id="chest" aria-label="Treasure chest">${CHEST_SVG}</button><div class="chest-tap" id="chestTap">Tap it! 👆</div>`;
  const ch = $('#chest'); let taps = 0;
  const tell = () => { if (my === nav) say('Ooh! A treasure chest! Tap it three times to open it!'); };
  if (after) after.then(tell); else tell();
  ch.onclick = () => {
    if (taps >= 3) return;
    taps++;
    ch.classList.remove('shake'); void ch.offsetWidth; ch.classList.add('shake');
    if (taps < 3){ sfx.knock(); ch.classList.add('c' + taps); return; }
    ch.classList.add('open'); $('#chestTap').remove();
    sfx.tada(); sfx.sparkle(); confetti(60);
    S.chests = (S.chests || 0) + 1;
    const p = rollPrize();
    const ov = document.createElement('div'); ov.className = 'prize-ov';
    const box = document.createElement('div'); box.className = 'prize'; ov.appendChild(box);
    const close = '<button class="big-btn" id="prizeOk">Yay! ✨</button>';
    if (p.item){
      S.owned.push(p.item.id); save();
      if (p.item.chest) setTimeout(() => sfx.sparkle(), 300);
      box.innerHTML = `${itemSwatch(p.item)}<b>You found ${esc(p.item.name)}!</b><div class="row"><button class="soft-btn" id="tryOn">👕 Try it on</button>${close}</div>`;
      say(`You found ${p.item.name}! It's yours to keep!`);
    } else {
      const v = p.gems.reduce((t, k) => t + GEM[k].v, 0);
      box.innerHTML = `<div class="gemrow">${p.gems.map(gemSVG).join('')}</div><b>+${v} gems!</b><div class="row">${close}</div>`;
      addGems(v); p.gems.forEach((k, j) => setTimeout(() => flyGem(k), 300 + j * 250));
      const nm = { blue:'blue gem', gold:'gold gem' }, cnt = {};
      p.gems.forEach(k => cnt[k] = (cnt[k] || 0) + 1);
      const parts = Object.entries(cnt).map(([k, n]) => `${n === 1 ? 'a' : n} ${nm[k]}${n > 1 ? 's' : ''}`);
      say(`You found ${parts.join(' and ')}! That's ${v} gems!`);
    }
    setTimeout(() => {
      if (my !== nav) return;
      document.body.appendChild(ov);
      $('#prizeOk').onclick = () => { sfx.pop(); ov.remove(); };
      const t = $('#tryOn');
      if (t) t.onclick = () => { ov.remove(); sfx.pop(); S.look[p.item.slot] = p.item.id; if (p.item.slot === 'top' || p.item.slot === 'bottom') S.look.dress = null; save(); closetScreen(closetTab(p.item.slot)); say(`Ooh, ${p.item.name}!`); };
    }, 450);
  };
  return true;
}

const CLOSET_TABS = [['hairStyle','💇 Style',['hairStyle']],['hairColor','🎨 Color',['hairColor']],['top','👕 Top',['top']],

function closetScreen(tab){
  setTop(true, true);
  if (tab === 'extras') tab = 'head';
  const T = CLOSET_TABS.find(t => t[0] === tab) || CLOSET_TABS[0]; tab = T[0];
  const list = ITEMS.filter(it => T[2].includes(it.slot));
  const swatch = itemSwatch;
  const isOn = it => S.look[it.slot] === it.id && !(S.look.dress && (it.slot === 'top' || it.slot === 'bottom'));
  screen.innerHTML = `<div class="closet">
    <div class="uni preview" id="preview">${guideSVG(null, 'full')}${petTag()}</div>
    <div class="tabs">${CLOSET_TABS.map(([k, l]) => `<button class="tab${k === tab ? ' on' : ''}" data-t="${k}">${l}</button>`).join('')}</div>
    <div class="items">${list.map(it => {
      const own = S.owned.includes(it.id), wearing = isOn(it);
      const tag = wearing ? 'Wearing ✓' : own ? 'Wear' : it.chest ? '🎁 In a chest' : '💎 ' + it.cost;
      return `<button class="item${wearing ? ' on' : ''}${own ? '' : ' locked-item'}${!own && it.chest ? ' chest-item' : ''}" data-id="${it.id}">
        ${swatch(it)}<b>${it.name}</b><small>${tag}</small></button>`;
    }).join('')}</div>
  </div>`;
  const tabsEl = screen.querySelector('.tabs'), onTab = tabsEl.querySelector('.on');
  if (onTab) tabsEl.scrollLeft = onTab.offsetLeft - 20;
  screen.querySelectorAll('.tab').forEach(b => b.onclick = () => { sfx.pop(); closetScreen(b.dataset.t); });
  const wear = it => { S.look[it.slot] = it.id; if (it.slot === 'top' || it.slot === 'bottom') S.look.dress = null; };
  screen.querySelectorAll('.item').forEach(b => b.onclick = () => {
    const it = item(b.dataset.id);
    const own = S.owned.includes(it.id), wearing = isOn(it);
    if (own && wearing && OPTIONAL.includes(it.slot)){
      S.look[it.slot] = null; save(); sfx.pop(); closetScreen(tab);
    } else if (own){
      wear(it); save(); sfx.chime();
      closetScreen(tab); say(`Ooh, ${it.name}!`);
    } else if (it.chest){
      b.classList.remove('wobble'); void b.offsetWidth; b.classList.add('wobble'); sfx.oops();
      say(`${it.name} is a secret treasure! You can only find it in a treasure chest!`);
    } else if (S.gems >= it.cost){
      S.gems -= it.cost; S.owned.push(it.id); wear(it); save();
      sfx.tada(); sfx.cheer(); confetti(40);
      closetScreen(tab); say(`You got ${it.name}! It looks amazing!`);
    } else {
      b.classList.remove('wobble'); void b.offsetWidth; b.classList.add('wobble'); sfx.oops();
      const need = it.cost - S.gems;
      say(`You need ${need} more ${need === 1 ? 'gem' : 'gems'}. Play a game to earn more!`);
    }
  });
}

    { id:'bed', x:20, y:92, flip:false }, { id:'plant', x:88, y:86, flip:false } ], me:{ x:56, y:96 } };
  return S.house;
}
const findBg = (arr, id) => (arr.find(x => x.id === id) || arr[0]).bg;
// Draws the room. In edit mode items can be dragged.
function roomHTML(edit){
  const H = houseState();
  const items = H.items.map((it, k) => {
    const f = furn(it.id); if (!f) return '';
    const z = f.rug ? 1 : 10 + Math.round(it.y);
    const inner = f.rug ? `<span class="rug" style="background:${f.rug};width:${f.s}cqw;height:${(f.s * .3).toFixed(1)}cqw"></span>`
      : `<span class="emo" style="font-size:${f.s}cqw">${f.e}</span>`;
    return `<div class="hitem${f.rug ? ' isrug' : ''}" data-k="${k}" style="left:${it.x}%;top:${it.y}%;z-index:${z}${it.flip ? ';--fx:-1' : ''}">${inner}</div>`;
  }).join('');
  const me = `<div class="hitem me" data-k="me" style="left:${H.me.x}%;top:${H.me.y}%;z-index:${10 + Math.round(H.me.y)}"><div class="me-in">${guideSVG(null, 'full')}${petTag()}</div></div>`;
  return `<div class="room${edit ? ' edit' : ''}" id="room">
    <div class="wall" style="background:${findBg(WALLS, H.wall)}"></div><div class="floor" style="background:${findBg(FLOORS, H.floor)}"></div>
    ${items}${me}</div>`;
}
function bindRoomDrag(onSelect){
  const room = $('#room'), H = houseState();
  room.querySelectorAll('.hitem').forEach(el => {
    el.onpointerdown = e => {
      e.preventDefault();
      const r = room.getBoundingClientRect(), k = el.dataset.k;
      const obj = k === 'me' ? H.me : H.items[+k];
      const f = k === 'me' ? null : furn(obj.id);
      const sx = e.clientX, sy = e.clientY, ox = obj.x, oy = obj.y; let moved = false;
      try { el.setPointerCapture(e.pointerId); } catch(err){}
      el.classList.add('drag');
      el.onpointermove = ev => {
        const dx = (ev.clientX - sx) / r.width * 100, dy = (ev.clientY - sy) / r.height * 100;
        if (Math.abs(dx) + Math.abs(dy) > 1.5) moved = true;
        obj.x = Math.max(4, Math.min(96, ox + dx));
        obj.y = Math.max(f && f.rug ? 72 : 14, Math.min(99, oy + dy));
        el.style.left = obj.x + '%'; el.style.top = obj.y + '%';
        if (!(f && f.rug)) el.style.zIndex = 10 + Math.round(obj.y);
      };
      el.onpointerup = el.onpointercancel = () => {
        el.onpointermove = el.onpointerup = el.onpointercancel = null; el.classList.remove('drag');
        obj.x = Math.round(obj.x * 10) / 10; obj.y = Math.round(obj.y * 10) / 10; save();
        if (moved) sfx.pop(); else onSelect && onSelect(k);
      };
    };
  });
}
const HOUSE_TABS = [['furn','🛋️ Furniture'],['wall','🖼️ Wall'],['toys','🧸 Toys'],['rugs','🧶 Rugs'],['walls','🎨 Walls'],['floors','🪵 Floors']];
function houseScreen(tab = 'furn', sel = null){
  setTop(true, true);
  const H = houseState();
  const list = tab === 'walls' ? WALLS.map(w => ({ ...w, kind:'wall' })) : tab === 'floors' ? FLOORS.map(f => ({ ...f, kind:'floor' }))
    : FURN.filter(f => f.cat === tab);
  const placed = id => H.items.some(it => it.id === id);
  const swatch = x => x.kind ? `<span class="hsw" style="background:${x.bg}"></span>`
    : x.rug ? `<span class="hsw rugsw" style="background:${x.rug}"></span>` : `<span class="hsw-e">${x.e}</span>`;
  const tag = x => {
    const own = H.owned.includes(x.id);
    if (x.kind) return (x.kind === 'wall' ? H.wall : H.floor) === x.id ? 'Using ✓' : own ? 'Use' : '💎 ' + x.cost;
    return placed(x.id) ? 'In room ✓' : own ? 'Put in room' : '💎 ' + x.cost;
  };
  const selIt = sel !== null && sel !== 'me' ? H.items[sel] : null;
  screen.innerHTML = `<div class="house">
    ${roomHTML(true)}
    <div class="htools" id="htools">${selIt ? `<b>${esc(furn(selIt.id).name)}</b>
        <button class="soft-btn" id="hFlip">↔ Flip</button><button class="soft-btn" id="hAway">📦 Put away</button>`
      : '<span>Drag things to move them. Tap one to flip it or put it away.</span>'}</div>
    <div class="tabs">${HOUSE_TABS.map(([k, l]) => `<button class="tab${k === tab ? ' on' : ''}" data-t="${k}">${l}</button>`).join('')}</div>
    <div class="items">${list.map(x => `<button class="item${placed(x.id) || (x.kind && tag(x) === 'Using ✓') ? ' on' : ''}${H.owned.includes(x.id) ? '' : ' locked-item'}" data-id="${x.id}">
      ${swatch(x)}<b>${esc(x.name)}</b><small>${tag(x)}</small></button>`).join('')}</div>
  </div>`;
  if (selIt){ const el = screen.querySelector(`.hitem[data-k="${sel}"]`); if (el) el.classList.add('sel'); }
  const tabsEl = screen.querySelector('.tabs'), onTab = tabsEl.querySelector('.on');
  if (onTab) tabsEl.scrollLeft = onTab.offsetLeft - 20;
  bindRoomDrag(k => {
    if (k === 'me'){ const m = screen.querySelector('.hitem.me .me-in'); m.classList.remove('hop'); void m.offsetWidth; m.classList.add('hop'); say('This is my room!'); return; }
    sfx.pop(); houseScreen(tab, +k);
  });
  if (selIt){
    $('#hFlip').onclick = () => { selIt.flip = !selIt.flip; save(); sfx.pop(); houseScreen(tab, sel); };
    $('#hAway').onclick = () => { H.items.splice(sel, 1); save(); sfx.pop(); houseScreen(tab); };
  }
  screen.querySelectorAll('.tab').forEach(b => b.onclick = () => { sfx.pop(); houseScreen(b.dataset.t); });
  screen.querySelectorAll('.item').forEach(b => b.onclick = () => {
    const id = b.dataset.id, x = list.find(y => y.id === id), own = H.owned.includes(id);
    const use = () => {
      if (x.kind === 'wall') H.wall = id; else if (x.kind === 'floor') H.floor = id;
      else if (!placed(id)) H.items.push({ id, x:Math.round(30 + Math.random() * 40), y:x.wall ? 40 : x.rug ? 90 : 94, flip:false });
    };
    if (own){
      if (!x.kind && placed(id)){ sfx.pop(); return houseScreen(tab, H.items.findIndex(it => it.id === id)); }
      use(); save(); sfx.chime(); houseScreen(tab); say(`Ooh, ${x.name}!`);
    } else if (S.gems >= x.cost){
      S.gems -= x.cost; H.owned.push(id); use(); save();
      sfx.tada(); sfx.cheer(); confetti(40); houseScreen(tab); say(`You got the ${x.name}! Drag it where you want it!`);
    } else {
      b.classList.remove('wobble'); void b.offsetWidth; b.classList.add('wobble'); sfx.oops();
      const need = x.cost - S.gems; say(`You need ${need} more ${need === 1 ? 'gem' : 'gems'}. Play a game to earn more!`);
    }
  });
}

/* ---- one level: a few mixed challenges ---- */
function storyLevel(k, i){
  setTop(true, true);
  const c = CHAPTERS[k], boss = i === 7, N = boss ? 5 : 3, my = nav;
  let q = 0, firstTries = 0, earned = 0;
  const kinds = boss ? ['word','math','word','shape','word'] : storyKinds();
  screen.innerHTML = `
    <div class="game-head">
      <div class="uni xs">${guideSVG()}</div>
      <div class="bubble" id="prompt"></div>
      <button class="icon-btn" id="hear" aria-label="Hear it again">🔊</button>
    </div>
    <div class="scene" style="background:${c.bg}">
      ${boss && c.final
        ? `<div class="lights" id="cage">${'<i></i>'.repeat(N)}</div>
           <div class="band">${[null, ...FRIEND_LOOKS].map(l => `<span>${guideSVG(l, 'full')}</span>`).join('')}</div>`
        : `<div class="scene-me">${guideSVG(null, 'full')}</div>
      ${boss ? `<div class="scene-friend">${guideSVG(FRIEND_LOOKS[k], 'full')}${
            c.cage === 'bubble' ? `<div class="bubble-cage" id="cage">${'<i></i>'.repeat(N)}</div>`
          : c.cage === 'tower' ? `<div class="tower" id="cage"><b class="door"></b><div class="locks">${'<i>🔒</i>'.repeat(N)}</div></div>`
          : `<div class="cage" id="cage">${'<i></i>'.repeat(N)}</div>`}</div>`
             : `<div class="scene-goal">${c.deco[i % c.deco.length]}</div>`}`}
      <div class="dots scene-dots" id="dots">${'<span></span>'.repeat(N)}</div>
    </div>
    <div class="qarea" id="qa"></div>`;
  const qa = $('#qa'), prompt = $('#prompt');
  let speakIt = null;
  $('#hear').onclick = () => speakIt && speakIt();
  const ctx = {
    my, qa, setPrompt: (t, spoken) => { prompt.textContent = t; speakIt = () => say(spoken || t); speakIt(); },
    gem: () => { earned += lucky(); }
  };
  const intro = boss && c.final ? c.levels[7]
    : boss && c.cage === 'tower' ? `${friendName(k)} is locked in the ${c.cageName}! Answer to open the locks!`
    : boss ? `${friendName(k)} is trapped in a ${c.cageName}! Answer to break it!` : c.levels[i].replace('your friend', friendName(k));
  prompt.textContent = intro;
  say(intro).then(next);

  function next(){
    if (my !== nav) return;
    screen.querySelectorAll('#dots span').forEach((d, j) => { d.className = j < q ? 'done' : j === q ? 'now' : ''; });
    if (q >= N) return finish();
    CHALLENGES[kinds[q]](ctx, ok => {
      if (my !== nav) return;   // he left this screen while the answer was showing
      if (ok) firstTries++;
      if (boss){
        const cg = $('#cage');
        if (c.cage === 'tower'){
          const lk = cg.querySelectorAll('.locks i')[q]; if (lk){ lk.textContent = '🔓'; lk.classList.add('open'); }
          if (q === N - 1) cg.classList.add('opened');
        } else if (c.cage === 'lights'){
          const bulb = cg.children[q]; if (bulb) bulb.classList.add('on'); sfx.chime();
        } else {
          const bar = cg.children[q]; if (bar) bar.classList.add('broke');
          if (c.cage === 'bubble'){ cg.style.setProperty('--left', N - q - 1); if (q === N - 1){ cg.classList.add('popped'); sfx.pop(); } }
        }
      }
      q++; setTimeout(next, 350);
    });
  }
  function finish(){
    const stars = boss ? 3 : firstTries === N ? 3 : firstTries >= N - 1 ? 2 : 1;
    const key = c.id + '-' + i, st = S.story;

function balloonGame(){
  setTop(true, true);
  const my = nav, round = pickRound(6), floorBefore = wordFloor();
  const scored = new Set(), requeued = new Set();
  let i = 0, earned = 0;
  screen.innerHTML = `
    <div class="game-head">
      <div class="uni xs">${guideSVG()}</div>
      <div class="bubble" id="prompt">Pop the word you hear!</div>
      <button class="icon-btn" id="hear" aria-label="Hear the word">🔊</button>
    </div>
    <div class="dots" id="dots"></div>
    <div class="field" id="field"></div>
    <div class="say-panel" id="sayPanel" hidden></div>`;
  const field = $('#field'), panel = $('#sayPanel'), prompt = $('#prompt');
  const sayTarget = w => sayWord(w).then(() => CLUES[w] ? say(CLUES[w]).then(() => sayWord(w)) : null);
  $('#hear').onclick = () => sayTarget(round[i]);

  function dots(){
    $('#dots').innerHTML = round.map((_, k) => `<span class="${k < i ? 'done' : k === i ? 'now' : ''}"></span>`).join('');
  }
  // Put a word back later in this round (once), so she gets another go at it.
  function comeBack(w){
    if (requeued.has(w)) return;
    requeued.add(w);
    round.splice(Math.min(round.length, i + 3), 0, w);
  }

  function next(){
    if (i >= round.length) return finish();
    dots();
    const w = round[i], again = scored.has(w);
    let firstTry = true, solved = false;
    panel.hidden = true; field.hidden = false;
    prompt.textContent = again ? "Let's try this one again!" : 'Pop the word you hear!';
    const colors = shuffle([0,1,2,3,4,5]);
    field.innerHTML = shuffle([w, ...distractors(w, 3)]).map((c, k) =>
      `<button class="balloon c${colors[k]}" data-w="${esc(c)}" style="--d:-${(Math.random()*3).toFixed(2)}s"><span>${esc(c)}</span></button>`
    ).join('');
    say(again ? "Let's try this one again. Find the word" : 'Find the word').then(() => sayTarget(w));

    field.querySelectorAll('.balloon').forEach(b => b.onclick = () => {
      if (solved) return;
      const c = b.dataset.w;
      if (c === w){
        solved = true;
        b.classList.add('popped'); sfx.pop(); setTimeout(sfx.chime, 120); confetti(14);
        if (firstTry && !again){ earned += lucky(); }
        setTimeout(() => { if (my === nav) sayIt(w, firstTry, again); }, 650);
      } else {
        if (firstTry && !again){ scoreWord(w, false); scored.add(w); save(); comeBack(w); dots(); }
        firstTry = false;
        b.classList.remove('wobble'); void b.offsetWidth; b.classList.add('wobble'); sfx.oops();
        say(`That one says ${c}. Try again!`).then(() => sayTarget(w));
      }
    });
  }

  function sayIt(w, popFirstTry, again){
    // Score a first-try pop after we know whether she could say it.
    const settle = saidOk => {
      if (!again && popFirstTry && !scored.has(w)){ scoreWord(w, true, saidOk); scored.add(w); }
      if (saidOk) st(w).said++;
      save();
    };
    field.hidden = true; panel.hidden = false;
    prompt.textContent = 'Now you say it!';
    const canMic = SR && !micBlocked;
    let tries = 0;
    panel.innerHTML = `
      <div class="word-card">${esc(w)}</div>
      <div class="say-msg" id="sayMsg">${canMic ? 'Tap the mic and say it!' : 'Say it out loud!'}</div>
      <div id="sayBtnWrap">${canMic
        ? `<button class="mic-btn" id="mic">🎤<span>Tap & say it</span></button>`
        : `<button class="big-btn" id="saidIt">I said it! ⭐</button>`}</div>
      <div class="row">
        <button class="soft-btn" id="again">🔊 Hear it</button>
        <button class="soft-btn" id="skip">Next ➜</button>
      </div>`;
    const msg = $('#sayMsg');
    say(pick(['You found it!','Great job!','Yay!']) + ' Now you say it.').then(() => sayWord(w));
    $('#again').onclick = () => sayWord(w);
    $('#skip').onclick = () => { stopVoice(); settle(null); advance(); };

    const honorButton = () => {
      $('#sayBtnWrap').innerHTML = `<button class="big-btn" id="saidIt">I said it! ⭐</button>`;
      bindHonor();
    };
    const bindHonor = () => {
      $('#saidIt').onclick = () => { settle(true); earned++; addGems(1); flyGem('pink'); sfx.chime(); advance(); };
    };
    if (!canMic){ bindHonor(); return; }

    const mic = $('#mic');
    mic.onclick = async () => {
      if (mic.classList.contains('listening')) return;
      stopVoice();
      mic.classList.add('listening'); msg.textContent = 'Listening… 👂';
      const r = await listen();
      mic.classList.remove('listening');

      if (!r.ok && ['not-allowed','service-not-allowed','audio-capture','unsupported','start'].includes(r.err)){
        micBlocked = true;
        msg.textContent = "The mic is off. That's okay! Say it out loud.";
        honorButton();
        return;
      }
      if (heard(w, r.alts || [])){
        settle(true);
        earned += 2; addGems(2); flyGem('pink', '+2'); sfx.tada(); confetti(30);
        msg.textContent = 'Perfect! ⭐⭐';
        await say(pick(['Perfect!','You said it!','Amazing!','Super star!']));
        advance();
        return;
      }
      tries++;
      if (tries < 3){
        msg.innerHTML = r.alts && r.alts.length
          ? `I heard “${esc(r.alts[0])}”. Try again!`
          : "I didn't hear you. Try again!";
        await say('Almost! Listen.'); await sayWord(w);
      } else {
        // Move on now, but bring this word back later in the round.
        settle(false); comeBack(w);
        msg.textContent = "Good try! We'll come back to it. 💜";
        await say(`Good try! This word is ${w}. We'll come back to it.`);
        advance();
      }
    };
  }

  function advance(){ if (my !== nav) return; i++; next(); }

  function finish(){
    S.rounds++;
    const f = wordFloor();
    roundDone(earned, f > floorBefore ? `${LEVEL_NAMES[f]} on the Word Race` : null, balloonGame);
  }

  next();
}

}
let started = false;
const pushStep = () => { try { history.pushState({ ian:1 }, ''); } catch(e){} };
const _setTop = setTop;
setTop = function(...a){ if (started) pushStep(); return _setTop.apply(this, a); };
addEventListener('popstate', () => {
  if (!started) return;
  stopVoice();
  document.querySelectorAll('.prize-ov').forEach(e => e.remove());
  const go = backTarget();
  if (go) go(); else { needGuard = true; pushStep(); }
});
// After Back on the home screen, her next tap re-arms the guard (Chrome only keeps steps made by a tap).
let needGuard = false;
addEventListener('pointerdown', () => { if (started && needGuard){ needGuard = false; pushStep(); } }, true);

splash();
</script>
</body>
